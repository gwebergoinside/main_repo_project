<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaLivre — Negociações e Audiências</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ML</span>
      <div>
        <h1>Negociações e Audiências</h1>
        <p class="sub">GO NEXT 360 · Media Livre</p>
      </div>
    </div>
    <div class="topbar-right">
      <p class="updated">Período <b id="periodo">—</b></p>
      <p class="updated">Atualizado em <b id="lastUpdate">—</b></p>
    </div>
  </header>

  <!-- Abas e filtros são preenchidos por app.js; as páginas vivem em pages.js. -->
  <nav class="tabs" id="tabs" aria-label="Páginas do relatório"></nav>
  <section class="filters" id="filters" aria-label="Filtros"></section>

  <main id="view" class="page-grid"></main>

  <footer class="disclaimer">
    Esqueleto de desenvolvimento — dados fictícios de <code>data/mock/dashboard.json</code>.
    Ainda não conectado ao Databricks. Cada indicador mapeia uma medida real do modelo
    (ver <code>docs/04-catalogo-indicadores.md</code>).
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
